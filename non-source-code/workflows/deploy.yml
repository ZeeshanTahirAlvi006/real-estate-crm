name: PropPulse OS CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck (Backend)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Dependencies
        run: cd server && npm ci

      - name: Execute TypeScript Type Check
        run: cd server && npm run typecheck

      - name: Build Production Distribution
        run: cd server && npm run build

  docker-build-test:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Server Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: false
          tags: proppulse-server:latest

  deployment-trigger:
    name: Trigger Cloud Deployments (Render & Vercel)
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, docker-build-test]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Notify Deployment Trigger
        run: echo "🚀 Automated CI checks passed. Cloud providers (Render & Vercel) triggered via Git webhooks."
