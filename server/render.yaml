services:
  - type: web
    name: proppulse-os-server
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: ENCRYPTION_MASTER_KEY
        generateValue: true
      - key: CLIENT_URL
        value: https://real-estate-grid2xfsj-codewithgoostyhumans-projects.vercel.app
      - key: STORAGE_PROVIDER
        value: local
